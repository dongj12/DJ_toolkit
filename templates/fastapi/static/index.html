<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>App</title>
  <link rel="icon" href="data:,">
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    form { display: flex; gap: .5rem; } input { flex: 1; padding: .5rem; } button { padding: .5rem 1rem; }
    .err { color: #c00; }
  </style>
</head>
<body>
  <h1>목록</h1>
  <form id="f"><input id="name" placeholder="이름" aria-label="이름"><button>추가</button></form>
  <p id="msg" class="err"></p>
  <ul id="list"></ul>
  <script>
    const $ = (s) => document.querySelector(s);
    async function load() {
      const items = await (await fetch('/api/items')).json();
      $('#list').innerHTML = '';
      for (const it of items) {
        const li = document.createElement('li');
        li.textContent = it.name;
        $('#list').append(li);
      }
    }
    $('#f').addEventListener('submit', async (e) => {
      e.preventDefault();
      const r = await fetch('/api/items', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: $('#name').value }),
      });
      $('#msg').textContent = r.ok ? '' : '추가 실패 (' + r.status + ')';
      if (r.ok) { $('#name').value = ''; load(); }
    });
    load();
  </script>
</body>
</html>
